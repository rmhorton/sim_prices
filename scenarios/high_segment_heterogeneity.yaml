name: High Segment Heterogeneity
description: Stronger differences in willingness to pay and price sensitivity by segment.
market_size: 60
inventory_limits:
  total: 120
customer_segment_proportions:
  Budget: 0.40
  Mainstream: 0.35
  Premium: 0.25
price_elasticity_parameters:
  Budget:
    alpha_mean: 0.5
    alpha_sd: 0.7
    beta_mean: -1.05
    beta_sd: 0.18
  Mainstream:
    alpha_mean: 1.7
    alpha_sd: 0.6
    beta_mean: -0.45
    beta_sd: 0.13
  Premium:
    alpha_mean: 3.2
    alpha_sd: 0.8
    beta_mean: -0.08
    beta_sd: 0.06
noise_levels:
  price_noise_sd: 0.15
  purchase_noise_sd: 0.03
simulation_horizon: 10
demand_shock_settings:
  enabled: true
  probability: 0.08
  logit_shift_mean: 0.25
  logit_shift_sd: 0.20
promotional_effects:
  enabled: true
  probability: 0.18
  logit_lift_mean: 0.30
  logit_lift_sd: 0.15
replenishment:
  enabled: false
  quantity: 0
  interval: .inf
inventory_behavior:
  enabled: true
  scarcity_logit_lift: 0.35
  abundance_logit_penalty: 0.20
